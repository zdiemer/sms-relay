{{- if and .Values.ingress.enabled .Values.notifications.grafanaHost }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "sms-relay.fullname" . }}-grafana-limits
spec:
  buffering:
    maxRequestBodyBytes: 65536
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "sms-relay.fullname" . }}-grafana-rate
spec:
  rateLimit:
    average: 30
    period: 1m
    burst: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sms-relay.fullname" . }}-grafana
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    ingress.zachd/tls-terminates-at-edge: "true"
    # Authentication is the dedicated Grafana bearer credential in the app.
    ingress.zachd/public-unauthenticated: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "sms-relay.fullname" . }}-grafana-limits@kubernetescrd,{{ .Release.Namespace }}-{{ include "sms-relay.fullname" . }}-grafana-rate@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.notifications.grafanaHost | quote }}
      http:
        paths:
          - path: /api/v1/grafana
            pathType: Exact
            backend:
              service:
                name: {{ include "sms-relay.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
