{{/*
Gateway credentials, per-service API keys, the inbound HMAC secret, and the
subscriber fan-out list. All injected as env vars; all values come from
values.local.yaml and never touch git.

apiKeys and webhookSecret are `required` because the chart is not safe without
them: an empty apiKeys means nobody can send, and an empty webhookSecret would
leave the un-gated /api/v1/inbound route (see ingress-webhook.yaml) with nothing
verifying its callers. The rest are optional — the gateway may be unauthenticated
on a trusted LAN, and fan-out is a feature you can leave off.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sms-relay.fullname" . }}
  labels:
    {{- include "sms-relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  SMS_RELAY_GATEWAY_USER: {{ .Values.secrets.gatewayUser | quote }}
  SMS_RELAY_GATEWAY_PASSWORD: {{ .Values.secrets.gatewayPassword | quote }}
  SMS_RELAY_API_KEYS: {{ required "secrets.apiKeys is required — a JSON object of service name -> key. Generate keys with: openssl rand -hex 32" .Values.secrets.apiKeys | quote }}
  SMS_RELAY_WEBHOOK_SECRET: {{ required "secrets.webhookSecret is required — it is the only authentication on the un-gated inbound webhook. Generate with: openssl rand -hex 32" .Values.secrets.webhookSecret | quote }}
  SMS_RELAY_SUBSCRIBERS: {{ .Values.secrets.subscribers | quote }}
