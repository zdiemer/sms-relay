[project]
name = "sms-relay"
version = "0.1.0"
description = "Self-hosted SMS gateway — a durable send/receive API in front of an Android SMS gateway."
requires-python = "==3.14.7"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy==2.0.51",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "phonenumbers==9.0.36",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.2"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sms_relay*"]

[tool.setuptools.package-data]
sms_relay = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
